<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CW review</title>
<style>/*__CSS__*/</style>
</head>
<body>

<header>
  <h1>CW review <span class="src" id="src"></span></h1>
  <div class="scores" id="scores"></div>
</header>

<section class="controls">
  <div class="group transport">
    <!-- The icon lives in its own fixed-width span so swapping play/stop
         can't change the button's width and shift the row. -->
    <button id="play-you" class="play"><i class="ico">▶</i>Your sending</button>
    <button id="play-tgt" class="play alt"><i class="ico">▶</i>Target</button>
    <button id="stop" disabled>■</button>
    <span class="clock" id="clock">0.0s</span>
  </div>

  <div class="group">
    <label for="wpm">Character speed <output id="wpm-out"></output></label>
    <input type="range" id="wpm" min="5" max="45" step="1">
  </div>

  <div class="group">
    <label for="farns">Overall (Farnsworth) <output id="farns-out"></output></label>
    <input type="range" id="farns" min="5" max="45" step="1">
  </div>

  <div class="group">
    <label for="tol">Tolerance <output id="tol-out"></output></label>
    <input type="range" id="tol" min="5" max="60" step="1">
  </div>

  <div class="group">
    <label for="gain" title="Applied at playback only — the embedded audio and the download stay at the level you recorded">
      Listening level <output id="gain-out"></output></label>
    <input type="range" id="gain" min="-6" max="42" step="1">
  </div>

  <div class="group grow">
    <label for="expected">Intended message <span class="hint" id="exp-src"></span></label>
    <input type="text" id="expected" spellcheck="false" autocomplete="off">
  </div>

  <div class="group">
    <label for="view">View</label>
    <select id="view">
      <option value="per-char">Per character</option>
      <option value="absolute">Absolute time</option>
      <option value="overlay">Overlay</option>
    </select>
  </div>

  <div class="group">
    <label for="zoom">Zoom <output id="zoom-out"></output></label>
    <input type="range" id="zoom" min="4" max="60" step="1">
  </div>

  <div class="group">
    <label class="check" for="rests"
           title="A silence more than three word gaps long is you stopping, not mis-spacing. Collapsed, it takes a fixed sliver of the chart, stays out of the grading, and the drift plot restarts after it. Off, every silence is graded and drawn to scale.">
      <input type="checkbox" id="rests" checked> Collapse rests</label>
  </div>
</section>

<section class="canvas-wrap">
  <div class="plot" id="plot"><canvas id="canvas"></canvas></div>
  <div class="tip" id="tip" hidden></div>
  <div class="belowplot">
    <p class="legend">
      <span class="sw ok"></span> within tolerance
      <span class="sw warn"></span> up to 2&times; off
      <span class="sw bad"></span> worse
      <span class="sw ghost"></span> missing
      <span class="sw rest"></span> rest (not graded)
      &nbsp;·&nbsp; click a character to hear it &nbsp;·&nbsp;
      click the ruler to seek &nbsp;·&nbsp; drag or scroll to pan
      (the view follows playback)
    </p>
    <div class="downloads">
      <button id="dl-you" title="The decoder's 8 kHz mono view of your recording">
        ↓ Your audio</button>
      <button id="dl-tgt" title="Perfect keying of the intended message, rendered at the current speed">
        ↓ Target audio</button>
      <button id="dl-png" title="The whole analysis, not just the visible part">
        ↓ Chart PNG</button>
      <button id="dl-json" title="Every number on this page, as JSON, graded at the settings currently set — same shape as cw-decode --json, so sessions stack up into a trend">
        ↓ JSON report</button>
      <span class="hint" id="dl-status"></span>
    </div>
  </div>
</section>

<section class="report" id="report"></section>

<script>window.MORSE = /*__MORSE__*/;</script>
<script>window.REVIEW = /*__PAYLOAD__*/;</script>
<script>/*__CORE_JS__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
