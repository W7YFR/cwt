<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="CWT">
  <!-- The name, half spelled and half sent. "CW" is written out; the T under
       it is a dah, which is the whole of the letter in Morse — so the mark
       reads as CWT to anyone, and as CWT twice over to anyone who can hear it.

       The dah is the one the icon has always had and keeps its 8 units of
       height, but not its rounded ends. Those made sense while it was the
       whole mark — it was a piece of the chart, drawn the way the chart draws
       one. Beside two letters cut square it was the only soft thing on the
       tile, which read as a bar from a different drawing rather than as the
       third character of this one. Widened to the width of the letters above
       it, too, because a bar that stops short of them reads as an underline
       that ran out rather than as a letter in its own right.

       Letters are stroked paths, not text. A <text> element renders in
       whatever font the machine happens to have, which for an icon means a
       different mark on every platform and no mark at all where the font is
       missing. These are geometry, so they are the same everywhere.

       Cut flat, not rounded, everywhere. Round caps gave every terminal a soft
       end and the letters read as chubby against the rest of the app, which is
       ASCII art and slab shapes. `butt` caps put a straight edge on every
       terminal; the low miter limit bevels every join flat, which keeps the
       W's apex inside the cap line instead of spiking past it; and the dah
       below has square corners for the same reason the letters do. One rule,
       applied to all three characters — the alternative was a corner radius on
       the one shape that could carry it, which is how it looked wrong.

       Taller than they are wide, which is why the C is an ellipse and not a
       circle. Drawn on a square the pair sat low and squat against a 48-unit
       tile: 22 units of cap height to 16 of C and 20 of W gives them
       somewhere to stand. The dah keeps its 8, so the block reads as two
       tall letters over a bar rather than as three bands of a similar size.

       No background, so it sits on a browser tab of either color. The tiles
       with a ground of their own are the PNGs, where a transparent icon would
       be composited onto whatever the platform felt like — and those are
       generated from this file by `make icons`, so this is the only place the
       shape is written down. -->
  <style>
    /* On `color`, so one declaration feeds both the stroked letters and the
       filled dah below. Set on fill and stroke separately, a rule in here
       would also override the `fill="none"` the letters need — CSS beats a
       presentation attribute — and quietly fill in the C. */
    .mark { color: #1f6feb; }
    @media (prefers-color-scheme: dark) { .mark { color: #6aa9ff; } }
  </style>
  <g class="mark">
    <g
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-miterlimit="1.4"
    >
      <!-- C: an elliptical arc, open on the right between ±34° of its own
           centre. A narrower gap than a friendly round C wants, because flat
           terminals read as a wider opening than round ones do at the same
           angle. -->
      <path d="M 17.03 13.00 A 5.64 8.50 0 1 0 17.03 22.50"/>
      <!-- W: four strokes, with the middle apex high enough to read as a W
           rather than as a u with a notch in it.

           Its centreline runs past the cap lines the C sits between — from
           7.15 to 28.30 against the C's 6.75 to 28.75 — and it has to, or the
           letter comes out visibly shorter than its neighbour. Half the stroke
           is the right inset only for a stroke that ends level. These do not:
           a butt cap is cut square to the direction of travel, so on a slanted
           stem it lands at an angle and the highest corner of it sits above
           where the centreline stops, while the bevelled joins at the feet
           pull the other way. The numbers below were measured off the render
           rather than derived, because the join geometry is what decides them. -->
      <path d="M 26.49 7.15 L 29.75 28.30 L 33.89 8.85 L 38.03 28.30 L 41.29 7.15"/>
    </g>
    <!-- T. -->
    <rect x="4.21" y="33.25" width="39.58" height="8" fill="currentColor"/>
  </g>
</svg>
