<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- A strict policy, and a cheap one: this app makes no network requests of
     any kind, so `connect-src 'none'` is a description of it rather than a
     restriction. Whatever you record never had a way off the machine, and now
     that is enforced rather than merely true.

     Three entries are load-bearing and none of them are guessable:

       script-src ... blob:  the microphone's AudioWorklet is compiled from a
                             source string and loaded through a blob URL (see
                             capture/mic.ts). Drop `blob:` and recording breaks
                             with nothing in the UI to say why.
       style-src 'unsafe-inline'
                             React writes `style={{...}}` as an inline style
                             attribute, which `style-src-attr` governs.
       img-src ... data:     the select-menu chevrons in base.css are data: SVGs.

     `frame-ancestors` is absent on purpose: it is ignored in a meta policy and
     has to arrive as a real header, which GitHub Pages cannot send. Same for
     Permissions-Policy and X-Content-Type-Options — putting them here would
     look like protection without being any. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<!-- The one outbound link is the author's QRZ page; it carries rel="noreferrer"
     itself, and this makes that the default for anything added later. -->
<meta name="referrer" content="no-referrer">
<title>CWT — CW Trainer</title>
<!-- Relative, not root-absolute: GitHub Pages serves a project site from
     /<repo>/, and an icon at /favicon.ico would be looked for on the domain
     root. Same reason vite.config.ts takes a base. -->
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12151a">
<meta name="description" content="CWT, the CW Trainer: record your sending and see exactly where your keying timing is solid and where a little practice will sharpen it up.">
<!-- Link previews: what a chat app or a social site shows when someone shares
     the address. The one place in this page that is absolute rather than
     relative, because crawlers do not resolve a relative URL here — so these
     name the live address, and work only once it is deployed there. The image
     is app/public/og-image.png; test/pure/og.test.ts holds that it exists and
     is the size these tags say. -->
<link rel="canonical" href="https://www.w7yfr.com/cwt/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="W7YFR">
<meta property="og:title" content="CWT — CW Trainer">
<meta property="og:description" content="Record your sending and see exactly where your keying timing is solid and where a little practice will sharpen it up.">
<meta property="og:url" content="https://www.w7yfr.com/cwt/">
<meta property="og:image" content="https://www.w7yfr.com/cwt/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CWT in block letters, over a target and a sent CQ drawn as dits and dahs.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
