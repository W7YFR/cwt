[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-decoder"
version = "0.1.0"
description = "Decode Morse code (CW) from audio, and hand the recording to the browser trainer for grading."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # Live capture. Not optional: --live is a headline feature, and the ffmpeg
    # fallback drops audio buffers on real hardware. Imported lazily, so
    # decoding files never pays for it, and the code still runs if PortAudio
    # itself is missing (Linux needs a system libportaudio2).
    "sounddevice>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cw-decode = "cw_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The review UI is no longer assembled here: `--web-review` writes a session
# bundle and serves the browser app (see bundle.py and serve.py), so there are
# no web assets inside the package.
