[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-decoder"
version = "0.1.0"
description = "Decode Morse code (CW) from an audio recording into text, with automatic speed detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Live capture via PortAudio. Preferred over the ffmpeg fallback: it buffers
# generously and reports input overflows instead of silently dropping buffers,
# and it works beyond macOS. The wheel bundles PortAudio.
live = ["sounddevice>=0.4"]

[project.scripts]
cw-decode = "cw_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The --web-review page is assembled from these at runtime.
cw_decoder = ["web/*.html", "web/*.css", "web/*.js"]
